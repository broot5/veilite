[workspace]
members = [
    "crates/veilite-core",
    "crates/veilite-turso",
    "crates/veilite-cli",
    "crates/veilite-integration-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/broot5/veilite"
readme = "README.md"

[workspace.dependencies]
aes = "0.9.3"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rpassword = "7.5.4"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
turso_core = { version = "=0.8.3", default-features = false, features = ["fs", "pure-rust-crypto", "json", "uuid"] }
veilite-core = { version = "0.1.0", path = "crates/veilite-core" }
veilite-turso = { version = "0.1.0", path = "crates/veilite-turso" }
zeroize = "1.9.1"
