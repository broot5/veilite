[workspace]
members = [
    "crates/veilite-core",
    "crates/veilite-graphitesql",
    "crates/veilite-cli",
    "crates/veilite-integration-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/broot5/veilite"
readme = "README.md"

[workspace.dependencies]
aes = "0.9.2"
bstr = { version = "1.13.0", default-features = false }
cbc = "0.2.1"
clap = { version = "4.6.2", features = ["derive"] }
graphitesql = "=0.1.7"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rpassword = "7.5.4"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
veilite-core = { version = "0.1.0", path = "crates/veilite-core" }
veilite-graphitesql = { version = "0.1.0", path = "crates/veilite-graphitesql" }
zeroize = "1.9.0"
