[workspace]
members = [
    "crates/veilite-core",
    "crates/veilite-graphitesql",
    "crates/veilite-cli",
    "crates/veilite-integration-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aes = "0.9.2"
cbc = "0.2.1"
clap = { version = "4.6.2", features = ["derive"] }
graphitesql = "=0.1.6"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rpassword = "7.5.4"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
veilite-core = { version = "0.1.0", path = "crates/veilite-core" }
veilite-graphitesql = { version = "0.1.0", path = "crates/veilite-graphitesql" }
zeroize = "1.9.0"
